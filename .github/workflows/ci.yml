name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python) build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Static syntax check
        run: python -m compileall -q apps/api/app

      - name: Run tests (if present)
        run: |
          if compgen -G "apps/api/tests/test_*.py" > /dev/null || compgen -G "apps/api/tests/*_test.py" > /dev/null; then
            python -m pip install pytest
            pytest -q
          else
            echo "No pytest tests found. Skipping."
          fi

  web:
    name: Web (Next.js) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint (if configured)
        run: |
          if npm run -s | grep -q "^lint"; then
            npm run lint || true
          else
            echo "No lint script defined. Skipping."
          fi

  docker-validate:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: apps/api/Dockerfile
          push: false

      - name: Build Web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: apps/web/Dockerfile
          push: false
