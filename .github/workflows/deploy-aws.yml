name: Deploy to AWS App Runner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate locally on the runner, or explicitly deploy'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy
      deploy_target:
        description: 'Choose what to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPOSITORY: clerk-backend
  ECR_FRONTEND_REPOSITORY: clerk-frontend
  BACKEND_SERVICE_ARN: arn:aws:apprunner:us-east-1:365591166807:service/clerk-backend/181518238ff148e88363a488640dd90d
  FRONTEND_SERVICE_ARN: arn:aws:apprunner:us-east-1:365591166807:service/clerk-frontend/7d7f42151edb48fb87d706a4cceb2e4a
  # Production API URL for frontend builds
  NEXT_PUBLIC_API_URL: https://api.mrrc.online

jobs:
  validate-amd64:
    name: Native AMD64 validation (no deployment)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record source and native runner
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          test "$(uname -m)" = x86_64
          test "$RUNNER_ARCH" = X64
          {
            echo "Source commit: $(git rev-parse HEAD)"
            echo "Workflow run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "Runner architecture: $(uname -m) / $RUNNER_ARCH"
            docker version
          } | tee validation-evidence/environment.txt

      - name: Build AMD64 images without registry push
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --target builder \
            --build-arg NEXT_PUBLIC_API_URL=https://api.mrrc.online \
            -t clerk-frontend-checks:local ./frontend 2>&1 | tee validation-evidence/frontend-builder.log
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=https://api.mrrc.online \
            -t clerk-frontend:local ./frontend 2>&1 | tee validation-evidence/frontend-build.log
          docker build --platform linux/amd64 -t clerk-backend:local ./backend \
            2>&1 | tee validation-evidence/backend-build.log
          for image in clerk-frontend:local clerk-backend:local; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
            docker image inspect --format 'Local image ID (not ECR digest): {{.Id}} platform={{.Os}}/{{.Architecture}} tags={{json .RepoTags}}' "$image"
          done | tee validation-evidence/image-identities.txt

      - name: Frontend tests, TypeScript and targeted ESLint
        run: |
          set -euo pipefail
          docker run --rm --network none clerk-frontend-checks:local sh -ec '
            npm test
            ./node_modules/.bin/tsc --noEmit --incremental false
            ./node_modules/.bin/eslint app/dashboard/profile/page.tsx app/local-login/page.tsx app/dashboard/reports/page.tsx app/dashboard/mailing-lists/page.tsx tests/*.mjs
          ' 2>&1 | tee validation-evidence/frontend-checks.log

      - name: Frontend isolated smoke and artifact inspection
        run: |
          set -euo pipefail
          docker run -d --name clerk-frontend-smoke --network none clerk-frontend:local
          trap 'docker rm -f clerk-frontend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec clerk-frontend-smoke node -e "fetch('http://127.0.0.1:3000/local-login', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 1
          done
          docker exec -i clerk-frontend-smoke node --input-type=commonjs <<'JS' 2>&1 | tee validation-evidence/frontend-smoke.log
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const indicators = [/data:text\/javascript;base64/i, /eval\s*\(\s*atob\s*\(/i, /bsc-testnet[^\s"']*\.binance/i, /wintermute:8000/i, /https?:\/\/(?:localhost|127\.0\.0\.1):8000/i];
          function inspect(text, label) {
            for (const pattern of indicators) assert(!pattern.test(text), `Unexpected indicator in ${label}: ${pattern}`);
          }
          async function main() {
            const base = 'http://127.0.0.1:3000';
            const response = await fetch(`${base}/local-login`, {signal: AbortSignal.timeout(5000)});
            assert.equal(response.status, 200);
            const html = await response.text();
            assert.match(html, /type="password"/);
            inspect(html, 'login HTML');
            const sources = [...html.matchAll(/<script\b[^>]*\bsrc\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/gi)].map(m => m[1] ?? m[2] ?? m[3]);
            assert(sources.length > 0, 'Expected Next.js static scripts');
            for (const source of sources) {
              assert.match(source, /^\/_next\/static\/[a-zA-Z0-9_./%-]+\.js(?:\?[^"'<>]*)?$/);
              const url = new URL(source, base);
              assert.equal(url.origin, base);
              const asset = await fetch(url, {signal: AbortSignal.timeout(5000)});
              assert.equal(asset.status, 200);
              inspect(await asset.text(), 'static script');
            }
            let inspected = 0;
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(file);
                else if (/\.(?:js|json|html)$/.test(file)) {
                  inspect(fs.readFileSync(file, 'utf8'), file);
                  inspected++;
                }
              }
            }
            walk('/app/.next');
            const sharp = require('sharp');
            const png = await sharp({create: {width: 2, height: 2, channels: 3, background: '#ffffff'}}).png().toBuffer();
            assert.equal((await sharp(png).metadata()).width, 2);
            console.log(`PASS: login HTML, ${sources.length} static scripts, ${inspected} artifacts, native Sharp synthetic image`);
          }
          main().catch(error => { console.error(error); process.exit(1); });
          JS

      - name: Backend runtime tools and startup logging regression
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint sh clerk-backend:local -ec '
            python -c "import fastapi, uvicorn, sqlalchemy, alembic, psycopg2, pydantic, boto3, paramiko"
            xelatex --version
            PYTHONDONTWRITEBYTECODE=1 python -m pytest --noconftest -p no:cacheprovider tests/test_startup_logging.py -q
          ' 2>&1 | tee validation-evidence/backend-checks.log

      - name: Backend network-disabled startup and health
        run: |
          set -euo pipefail
          docker run -d --name clerk-backend-smoke --network none \
            -e CLERK_ENV=production -e DEBUG=false \
            -e SESSION_COOKIE_SECURE=true -e SESSION_COOKIE_SAMESITE=lax \
            -e AUTH_SECRET_KEY=synthetic-amd64-validation-only-not-for-production \
            -e CORS_ORIGINS='["https://clerk.mrrc.online"]' \
            -e DATABASE_URL=sqlite:///:memory: -e DISABLE_AUTO_MIGRATE=true \
            -e ENABLE_IONOS_ROSTER_PUBLISH=false -e AWS_EC2_METADATA_DISABLED=true \
            clerk-backend:local
          trap 'docker rm -f clerk-backend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec clerk-backend-smoke python -c 'import json, urllib.request; r = urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2); assert r.status == 200; assert json.load(r) == {"status": "healthy"}'; then
              echo 'PASS: normal backend startup and /health; no database queries or migrations' | tee validation-evidence/backend-smoke.log
              break
            fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 1
          done

      - name: Record validation outcome
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          mkdir -p validation-evidence
          if [ "$VALIDATION_STATUS" = success ]; then
            message='AMD64 validation passed; not deployed.'
          else
            message="AMD64 validation $VALIDATION_STATUS; not deployed."
          fi
          echo "$message" | tee validation-evidence/result.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'No PostgreSQL connectivity, migrations, AWS or IONOS operations validated.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd64-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: validation-evidence/
          retention-days: 14

  deploy-backend:
    name: Deploy Backend to App Runner
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' &&
      (inputs.deploy_target == 'backend' || inputs.deploy_target == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building backend image..."
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG ./backend

          echo "Tagging as latest..."
          docker tag $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

          echo "Pushing images to ECR..."
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

          echo "✅ Backend image pushed successfully"

      - name: Deploy to App Runner
        run: |
          echo "Triggering App Runner deployment..."
          aws apprunner start-deployment \
            --service-arn ${{ env.BACKEND_SERVICE_ARN }} \
            --region ${{ env.AWS_REGION }}

          echo "✅ Backend deployment initiated"

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete (max 10 minutes)..."
          for i in {1..60}; do
            STATUS=$(aws apprunner describe-service \
              --service-arn ${{ env.BACKEND_SERVICE_ARN }} \
              --region ${{ env.AWS_REGION }} \
              --query 'Service.Status' \
              --output text)

            echo "Deployment status: $STATUS (check $i/60)"

            if [ "$STATUS" == "RUNNING" ]; then
              echo "✅ Backend deployment completed successfully!"
              exit 0
            elif [ "$STATUS" == "OPERATION_IN_PROGRESS" ]; then
              sleep 10
            else
              echo "❌ Unexpected status: $STATUS"
              exit 1
            fi
          done

          echo "⚠️ Deployment timed out after 10 minutes"
          exit 1

      - name: Test backend health
        run: |
          echo "Testing backend health endpoint..."
          sleep 10  # Give the service a moment to stabilize

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.mrrc.online/health)

          if [ "$RESPONSE" == "200" ]; then
            echo "✅ Backend health check passed!"
          else
            echo "❌ Backend health check failed with status $RESPONSE"
            exit 1
          fi

      - name: Scan backend logs for startup errors (last 10 minutes)
        run: |
          echo "Scanning App Runner application logs for startup failures..."
          START_TIME=$(( ($(date -u +%s) - 600) * 1000 ))
          if ! LOG_MESSAGES=$(aws logs filter-log-events \
            --log-group-name "/aws/apprunner/clerk-backend/181518238ff148e88363a488640dd90d/application" \
            --start-time "$START_TIME" \
            --region ${{ env.AWS_REGION }} \
            --query 'events[].message' \
            --output text 2>&1); then
            echo "⚠️ Warning: Unable to retrieve backend logs; skipping startup log scan."
            echo "$LOG_MESSAGES"
            exit 0
          fi

          if echo "$LOG_MESSAGES" | grep -Eiq "ModuleNotFoundError|exec format error|Traceback"; then
            echo "❌ Detected backend startup failures in recent logs"
            echo "$LOG_MESSAGES" | grep -Ei "ModuleNotFoundError|exec format error|Traceback" || true
            exit 1
          fi

          echo "✅ No startup failure signatures found in recent logs"

  deploy-frontend:
    name: Deploy Frontend to App Runner
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' &&
      (inputs.deploy_target == 'frontend' || inputs.deploy_target == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building frontend image with production configuration..."
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }} \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG \
            ./frontend

          echo "Tagging as latest..."
          docker tag $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

          echo "Pushing images to ECR..."
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

          echo "✅ Frontend image pushed successfully"

      - name: Deploy to App Runner
        run: |
          echo "Triggering App Runner deployment..."
          aws apprunner start-deployment \
            --service-arn ${{ env.FRONTEND_SERVICE_ARN }} \
            --region ${{ env.AWS_REGION }}

          echo "✅ Frontend deployment initiated"

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete (max 10 minutes)..."
          for i in {1..60}; do
            STATUS=$(aws apprunner describe-service \
              --service-arn ${{ env.FRONTEND_SERVICE_ARN }} \
              --region ${{ env.AWS_REGION }} \
              --query 'Service.Status' \
              --output text)

            echo "Deployment status: $STATUS (check $i/60)"

            if [ "$STATUS" == "RUNNING" ]; then
              echo "✅ Frontend deployment completed successfully!"
              exit 0
            elif [ "$STATUS" == "OPERATION_IN_PROGRESS" ]; then
              sleep 10
            else
              echo "❌ Unexpected status: $STATUS"
              exit 1
            fi
          done

          echo "⚠️ Deployment timed out after 10 minutes"
          exit 1

      - name: Test frontend
        run: |
          echo "Testing frontend accessibility..."
          sleep 10  # Give the service a moment to stabilize

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://test.mrrc.online)

          if [ "$RESPONSE" == "200" ]; then
            echo "✅ Frontend health check passed!"
          else
            echo "❌ Frontend health check failed with status $RESPONSE"
            exit 1
          fi

  notify-completion:
    name: Report validation or deployment outcome
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [validate-amd64, deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Report selected operation
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.deploy_target }}
          VALIDATION: ${{ needs.validate-amd64.result }}
          BACKEND: ${{ needs.deploy-backend.result }}
          FRONTEND: ${{ needs.deploy-frontend.result }}
        run: |
          set -euo pipefail
          if [ "$MODE" = validate ]; then
            test "$BACKEND" = skipped
            test "$FRONTEND" = skipped
            if [ "$VALIDATION" = success ]; then
              echo 'AMD64 validation passed; not deployed.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "AMD64 validation $VALIDATION; not deployed." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          elif [ "$MODE" = deploy ]; then
            echo "Deployment results: backend=$BACKEND frontend=$FRONTEND" >> "$GITHUB_STEP_SUMMARY"
            case "$TARGET" in
              both) test "$BACKEND" = success; test "$FRONTEND" = success ;;
              backend) test "$BACKEND" = success; test "$FRONTEND" = skipped ;;
              frontend) test "$FRONTEND" = success; test "$BACKEND" = skipped ;;
              *) exit 1 ;;
            esac
            echo 'Selected deployment jobs succeeded; AMD64 validation was not run in this invocation.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No valid operation selected; no success claimed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
