name: Diagnostics - Check CD secrets and OIDC

on:
  workflow_dispatch:

jobs:
  check-secrets:
    name: Check repository secrets presence
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger context
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "actor=${{ github.actor }}"

      - name: Validate repository secrets presence
        run: |
          fail=0
          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "::error::Missing repository secret AWS_REGION"
            fail=1
          else
            echo "::notice::AWS_REGION is set"
          fi
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "::error::Missing repository secret AWS_ROLE_TO_ASSUME"
            fail=1
          else
            echo "::notice::AWS_ROLE_TO_ASSUME is set"
          fi
          exit $fail

  oidc-assume:
    name: Attempt OIDC role assumption and STS identity
    needs: check-secrets
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify caller identity
        run: aws sts get-caller-identity
