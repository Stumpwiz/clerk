[alembic]
# Path to migration scripts
script_location = alembic

# Use the DATABASE_URL from the environment; env.py will override this at runtime
# Keep a sensible default for local SQLite if DATABASE_URL is not provided
sqlalchemy.url = sqlite:///./instance/community_admin.db

# Logging configuration (basic)
log_level = INFO
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
# Note: timezone is optional; removing it avoids platform-specific tz lookup issues

[post_write_hooks]
# no hooks by default
