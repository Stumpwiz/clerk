[alembic]
# Path to migration scripts
script_location = alembic

# Use the DATABASE_URL from the environment; env.py will override this at runtime
# PostgreSQL connection URL - override with DATABASE_URL environment variable in production
sqlalchemy.url = postgresql://clerk_user:clerk_password@localhost:5432/clerk_community_admin

# Logging configuration (basic)
log_level = INFO
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
# Note: timezone is optional; removing it avoids platform-specific tz lookup issues

[post_write_hooks]
# no hooks by default
