# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# sqlalchemy.url = sqlite:///./community_admin.db
# We set the URL dynamically in alembic/env.py from app.core.config.settings

# default to the generic 'console' logger
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
